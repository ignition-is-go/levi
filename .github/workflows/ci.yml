name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-quality.yml@26d3bb214308c6ee69ffdadb72f5cbcea84ae0ec # v1.1.0 candidate
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_ACCESS_KEY }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_SECRET_KEY }}
    with:
      cargo-flux-version: "0.7.0"
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm
      linux-runner-json: '"ci-public-linux-ephemeral"'

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native-build.yml@26d3bb214308c6ee69ffdadb72f5cbcea84ae0ec # v1.1.0 candidate
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_ACCESS_KEY }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_SECRET_KEY }}
    with:
      package: levi
      linux-runner-json: '"ci-public-linux-ephemeral"'
      macos-runner-json: '"ci-macos-ephemeral"'
      windows-runner-json: '{"group":"ci-windows-ephemeral","labels":["self-hosted","Windows","X64","cpu-ge-8","disk-ge-100g"]}'
      macos-compiler-cache: false
      windows-target-cache: false
