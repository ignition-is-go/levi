name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-quality.yml@v1.1.1 # v1.0.0
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_ACCESS_KEY }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_SECRET_KEY }}
    with:
      cargo-flux-version: "0.7.0"
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm
      linux-runner-json: '["self-hosted","Linux","X64","ram-ge-16g","disk-ge-100g"]'

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native-build.yml@v1.1.1
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_ACCESS_KEY }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_SECRET_KEY }}
    with:
      package: levi
      macos-x64: false
      linux-runner-json: '["self-hosted","Linux","X64","ram-ge-16g","disk-ge-100g"]'
      macos-runner-json: '["self-hosted","macOS","ARM64","site-lucid-lab","ram-ge-24g","disk-ge-100g"]'
      windows-runner-json: '"windows-2025"'
      macos-compiler-cache: false
      windows-compiler-cache: false
      windows-target-cache: false
