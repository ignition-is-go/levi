name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources && sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-flux
      - run: cargo flux run check
      - run: cargo flux run lint
      - run: cargo flux run test

      # wasm32 coverage for levi-dash (see its `[package.metadata.flux]`
      # tasks list) — `check` alone only exercises the native target, so a
      # break in `#[cfg(target_arch = "wasm32")]` code would pass CI silently.
      - run: cargo flux run check-wasm

  native-cli:
    name: Native CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ci-public-linux-ephemeral
            target: x86_64-unknown-linux-gnu
          - os: ci-macos-ephemeral
            target: x86_64-apple-darwin
          - os: ci-macos-ephemeral
            target: aarch64-apple-darwin
          - os: ci-windows-ephemeral
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - run: cargo build --release --locked --package levi --target ${{ matrix.target }}
