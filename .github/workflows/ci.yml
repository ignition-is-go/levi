name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-check.yml@136369caf7e86d750b9fbbeb63871515113dfff6
    with:
      cargo-flux-version: "0.7.0"
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native.yml@136369caf7e86d750b9fbbeb63871515113dfff6
    with:
      package: levi
