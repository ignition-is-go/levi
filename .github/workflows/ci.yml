name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-check.yml@87f2ffc7f6db834215906be20cb93254937ca5e7
    secrets: inherit
    with:
      cargo-flux-version: "0.7.0"
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm
      runner-json: '"ci-public-linux-ephemeral"'

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native.yml@87f2ffc7f6db834215906be20cb93254937ca5e7
    secrets: inherit
    with:
      package: levi
      linux-runner-json: '"ci-public-linux-ephemeral"'
      macos-runner-json: '"ci-macos-ephemeral"'
      windows-runner-json: '{"group":"ci-windows-ephemeral","labels":["self-hosted","Windows","X64","cpu-ge-8","disk-ge-100g"]}'
      macos-sccache: false
