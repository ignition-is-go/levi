name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-check.yml@dc9f125e7dfa9ddbfa95084acfcf1861ea726e8d
    with:
      cargo-flux-version: "0.7.0"
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native.yml@dc9f125e7dfa9ddbfa95084acfcf1861ea726e8d
    with:
      package: levi
