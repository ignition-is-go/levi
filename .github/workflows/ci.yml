name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    uses: ignition-is-go/pulse-actions/.github/workflows/cargo-flux-quality.yml@3dbe244f9191e21ae8985511c0b0306edbc59845 # v2.0.0 acceptance
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
    with:
      cargo-flux-version: "0.11.7"
      cache-target-backend: flux-s3
      compiler-cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT }}
      compiler-cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET }}
      targets: wasm32-unknown-unknown
      tasks: check lint test check-wasm
      linux-runner-json: '["self-hosted","Linux","X64","ram-ge-16g","disk-ge-100g"]'

  native-cli:
    name: Native CLI
    uses: ignition-is-go/pulse-actions/.github/workflows/rust-native-build.yml@e956d5a7c5ccf968a7834e0b9a992c4355b5ccf3
    secrets:
      CI_CACHE_ENDPOINT: ${{ secrets.CI_CACHE_ENDPOINT }}
      CI_CACHE_BUCKET: ${{ secrets.CI_CACHE_BUCKET }}
      CI_CACHE_ACCESS_KEY: ${{ secrets.CI_CACHE_ACCESS_KEY }}
      CI_CACHE_SECRET_KEY: ${{ secrets.CI_CACHE_SECRET_KEY }}
    with:
      package: levi
      macos-x64: false
      linux-runner-json: '["self-hosted","Linux","X64","ram-ge-16g","disk-ge-100g"]'
      macos-runner-json: '["self-hosted","macOS","ARM64","site-lucid-lab","ram-ge-24g"]'
      windows-runner-json: '["self-hosted","Windows","X64","ram-ge-8g","disk-ge-100g"]'
      macos-compiler-cache: false
      windows-compiler-cache: false
      windows-target-cache: false
