name: Release

on:
  push:
    branches: [main]

jobs:
  prepare:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Git
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - run: cargo install cargo-flux

      - name: Check if release commit
        id: check
        run: |
          if git log -1 --format='%s' | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp, commit, tag, and push
        id: release
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=$(cargo flux version)
          if [ -z "$VERSION" ]; then
            echo "nothing to release (no version bump from the new commits)"
            exit 0
          fi
          cargo flux stamp "$VERSION"
          cargo update --workspace
          cargo fmt --all
          git add -A
          git commit -m "chore(release): v$VERSION"
          TAG="v${VERSION}"
          git tag "$TAG" -m "Release $VERSION"
          git push origin HEAD "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release-binaries:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: public-ci
            target: x86_64-unknown-linux-gnu
            binary_ext: ''
          - os: public-ci-macos
            target: x86_64-apple-darwin
            binary_ext: ''
          - os: public-ci-macos
            target: aarch64-apple-darwin
            binary_ext: ''
          - os: public-ci-windows
            target: x86_64-pc-windows-msvc
            binary_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Build Levi CLI
        run: cargo build --release --locked --package levi --target ${{ matrix.target }}
      - name: Package Levi CLI
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          archive="levi-${VERSION}-${TARGET}.tgz"
          tar -C "target/${TARGET}/release" -czf "$archive" "levi${BINARY_EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: levi-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    needs: [prepare, release-binaries]
    if: needs.prepare.outputs.tag != ''
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: levi-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name 'levi-*.tgz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name 'levi-*.tgz.sha256' | wc -l)" -eq 4
          for checksum in levi-*.tgz.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --latest dist/*

  verify-action:
    needs: [prepare, publish-release]
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: public-ci
          - os: macos-intel
            runner: public-ci-macos
          - os: macos-arm
            runner: public-ci-macos
          - os: windows
            runner: public-ci-windows
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install the published Levi binary through the action
        id: setup
        uses: ./
        with:
          version: ${{ needs.prepare.outputs.version }}
          check: 'false'
      - name: Create a closed-claim fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/levi-action-smoke"
          mkdir -p "$fixture"
          cd "$fixture"
          git init -q -b smoke
          git config user.email action-smoke@example.com
          git config user.name 'Action Smoke'
          git commit -q --allow-empty -m initial
          levi --no-sync init
          task_id="$(levi --no-sync add 'action smoke task' | awk '{ print $2 }')"
          levi --no-sync start "$task_id"
          git commit -q --allow-empty -m fix
          levi --no-sync close "$task_id"
      - name: Run the published claim gate
        id: gate
        uses: ./
        with:
          version: ${{ needs.prepare.outputs.version }}
          root: ${{ runner.temp }}/levi-action-smoke
          git-ref: smoke
          fetch-events: 'false'
      - name: Verify action outputs and PATH
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.gate.outputs.version }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          RESULT: ${{ steps.gate.outputs.result }}
        run: |
          test "$INSTALLED_VERSION" = "$EXPECTED_VERSION"
          grep -q '"schema":"levi.check-claims/1"' <<< "$RESULT"
          grep -q '"ok":true' <<< "$RESULT"
          levi --help
