name: Windows cache benchmark

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Windows cache (${{ matrix.cache }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [none, rust-cache, kache]
    runs-on: ci-windows-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore rust-cache
        if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release-benchmark-v2
          cache-bin: false

      - name: Restore kache
        if: matrix.cache == 'kache'
        uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          cache-key-prefix: levi-windows-release-benchmark-v2
          pr-comment: false
          max-size: 8GiB

      - name: Build and record wall time
        id: build
        shell: bash
        run: |
          started_ms=$(date +%s%3N)
          set +e
          cargo build --release --locked --package levi --target x86_64-pc-windows-msvc
          result=$?
          finished_ms=$(date +%s%3N)
          seconds=$(awk "BEGIN { printf \"%.3f\", ($finished_ms - $started_ms) / 1000 }")
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.cache }}: $seconds seconds" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Record benchmark result
        if: always()
        shell: bash
        run: |
          printf '{"cache":"%s","build_seconds":"%s","run_attempt":"%s","commit":"%s"}\n' \
            '${{ matrix.cache }}' \
            '${{ steps.build.outputs.seconds }}' \
            '${{ github.run_attempt }}' \
            '${{ github.sha }}' \
            > benchmark-${{ matrix.cache }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cache-${{ matrix.cache }}
          path: benchmark-${{ matrix.cache }}.json
