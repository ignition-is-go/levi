name: Windows cache benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-cache-benchmark.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Windows cache (${{ matrix.cache }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [none, rust-cache, kache]
    runs-on: ci-windows-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore rust-cache
        if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release-benchmark
          cache-bin: false

      - name: Restore kache
        if: matrix.cache == 'kache'
        uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          cache-key-prefix: levi-windows-release-benchmark
          pr-comment: false
          max-size: 8GiB

      - name: Build and record wall time
        id: build
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked --package levi --target x86_64-pc-windows-msvc
          $result = $LASTEXITCODE
          $timer.Stop()
          $seconds = [math]::Round($timer.Elapsed.TotalSeconds, 3)
          "seconds=$seconds" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "### ${{ matrix.cache }}: $seconds seconds" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $result

      - name: Record benchmark result
        if: always()
        shell: pwsh
        run: |
          $record = [ordered]@{
            cache = '${{ matrix.cache }}'
            build_seconds = '${{ steps.build.outputs.seconds }}'
            run_attempt = '${{ github.run_attempt }}'
            commit = '${{ github.sha }}'
          }
          $record | ConvertTo-Json | Set-Content benchmark-${{ matrix.cache }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cache-${{ matrix.cache }}
          path: benchmark-${{ matrix.cache }}.json
