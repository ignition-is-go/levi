name: Windows cache benchmark

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Windows cache (${{ matrix.cache }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [kache]
    runs-on: ci-windows-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned kache workaround
        if: matrix.cache == 'kache'
        shell: powershell
        run: |
          $version = '0.16.0'
          $archive = Join-Path $env:RUNNER_TEMP 'kache.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'kache-extract'
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "kache\$version\x64"
          Invoke-WebRequest 'https://github.com/kunobi-ninja/kache/releases/download/v0.16.0/kache-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne 'b4b53a54926e5cdc8c084562fdf215780306c9d5dc7eeaff9e4eb70c0b47fe2a') {
            throw "kache archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item (Get-ChildItem $extract -Recurse -Filter kache.exe | Select-Object -First 1).FullName $toolDir
          New-Item -ItemType File -Force -Path "$toolDir.complete" | Out-Null

      - name: Restore rust-cache
        if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release-benchmark-v3
          cache-bin: false

      - name: Restore kache
        if: matrix.cache == 'kache'
        uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: v0.16.0
          s3-bucket: ${{ vars.CI_CACHE_S3_BUCKET }}
          s3-region: us-east-1
          s3-prefix: levi/windows-release
          s3-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
          manifest-key: x86_64-pc-windows-msvc-release
          namespace: levi-windows-release
          pr-comment: false
          max-size: 8GiB

      - name: Build and record wall time
        id: build
        shell: bash
        run: |
          # Git Bash prepends its GNU tools, including an incompatible link.exe.
          # Resolve cl.exe from the activated VS environment and put its sibling
          # MSVC linker ahead of Git's /usr/bin.
          msvc_bin=$(dirname "$(command -v cl.exe)")
          export PATH="$msvc_bin:$PATH"
          command -v link.exe
          started_ms=$(date +%s%3N)
          set +e
          cargo build --release --locked --package levi --target x86_64-pc-windows-msvc
          result=$?
          finished_ms=$(date +%s%3N)
          seconds=$(awk "BEGIN { printf \"%.3f\", ($finished_ms - $started_ms) / 1000 }")
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.cache }}: $seconds seconds" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Record benchmark result
        if: always()
        shell: bash
        run: |
          printf '{"cache":"%s","build_seconds":"%s","run_attempt":"%s","commit":"%s"}\n' \
            '${{ matrix.cache }}' \
            '${{ steps.build.outputs.seconds }}' \
            '${{ github.run_attempt }}' \
            '${{ github.sha }}' \
            > benchmark-${{ matrix.cache }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cache-${{ matrix.cache }}
          path: benchmark-${{ matrix.cache }}.json
