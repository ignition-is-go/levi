name: Windows cache benchmark

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Windows cache (${{ matrix.cache }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [sccache]
    runs-on: ci-windows-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned sccache
        if: matrix.cache == 'sccache'
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'sccache-extract'
          Invoke-WebRequest 'https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne 'e94cfc5b58cbe439302f586c1d1bd7980c2cd371d47bdf385ade657411e6f3ac') {
            throw "sccache archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $binary = (Get-ChildItem $extract -Recurse -Filter sccache.exe | Select-Object -First 1).FullName
          Copy-Item $binary (Join-Path $env:RUNNER_TEMP 'sccache.exe')
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore rust-cache
        if: matrix.cache == 'rust-cache'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release-benchmark-v3
          cache-bin: false

      - name: Build and record wall time
        id: build
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_BUCKET: ${{ vars.CI_CACHE_S3_BUCKET }}
          SCCACHE_REGION: auto
          SCCACHE_ENDPOINT: ${{ vars.CI_CACHE_S3_ENDPOINT }}
          SCCACHE_S3_USE_SSL: "false"
          SCCACHE_S3_KEY_PREFIX: levi/windows-release/sccache-v0.17
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
        run: |
          # Git Bash prepends its GNU tools, including an incompatible link.exe.
          # Resolve cl.exe from the activated VS environment and put its sibling
          # MSVC linker ahead of Git's /usr/bin.
          msvc_bin=$(dirname "$(command -v cl.exe)")
          export PATH="$msvc_bin:$PATH"
          command -v link.exe
          if [[ '${{ matrix.cache }}' == 'sccache' ]]; then
            sccache --zero-stats
          fi
          started_ms=$(date +%s%3N)
          set +e
          cargo build --release --locked --package levi --target x86_64-pc-windows-msvc
          result=$?
          finished_ms=$(date +%s%3N)
          seconds=$(awk "BEGIN { printf \"%.3f\", ($finished_ms - $started_ms) / 1000 }")
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.cache }}: $seconds seconds" >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ matrix.cache }}' == 'sccache' ]]; then
            sccache --show-stats
            sccache --stop-server || true
          fi
          exit "$result"

      - name: Record benchmark result
        if: always()
        shell: bash
        run: |
          printf '{"cache":"%s","build_seconds":"%s","run_attempt":"%s","commit":"%s"}\n' \
            '${{ matrix.cache }}' \
            '${{ steps.build.outputs.seconds }}' \
            '${{ github.run_attempt }}' \
            '${{ github.sha }}' \
            > benchmark-${{ matrix.cache }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cache-${{ matrix.cache }}
          path: benchmark-${{ matrix.cache }}.json
