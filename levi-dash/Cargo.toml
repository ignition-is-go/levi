[package]
name = "levi-dash"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.flux]
tasks = ["check", "check-wasm", "lint"]

[[bin]]
name = "levi-dash"
path = "src/main.rs"

[dependencies]
levi-core = { workspace = true }
myko = { workspace = true }
myko-leptos = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
# Git, not crates.io, and it has to stay that way: the `mullion` name on
# crates.io belongs to an unrelated terminal-UI crate, so a version spec
# here would silently pull the wrong library.
mullion = { git = "https://github.com/ignition-is-go/mullion", branch = "main" }
pulse-leptos-ui = "0.9"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
