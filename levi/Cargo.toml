[package]
name = "levi"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Git-aware, agent-first, distributed issue tracker"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[[bin]]
name = "levi"
path = "src/main.rs"

[dependencies]
levi-core = { workspace = true }
myko = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
ciborium = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
gix = "0.84"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
fs4 = "0.13"
toml = "0.8"
log = { workspace = true }
tokio = { workspace = true }

[dev-dependencies.myko-server]
workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
