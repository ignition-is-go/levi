[workspace]
resolver = "2"
members = ["levi-core", "levi", "levi-hub", "levi-dash"]
# levi-dash is wasm-only (built with trunk); keep native builds/tests to the rest
default-members = ["levi-core", "levi", "levi-hub"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ignition-is-go/levi"

[workspace.dependencies]
myko = "6.5.1"
myko-server = "6.5.1"
myko-leptos = "6.5.1"
autosocket = "4.24.4"
levi-core = { version = "0.9.0", path = "levi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
